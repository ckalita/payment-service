server.port=9180
spring.application.name=payment-service

spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultzone = http://eureka-registry:8761/eureka/
eureka.instance.hostname=payment-service 

management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.endpoints.web.exposure.include=*
management.metrics.distribution.percentiles-histogram.greeting=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.zipkin.base-url=http://zipkin:9411

spring.devtools.restart.enabled=false

spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379

logging.level.org.springframework.data.redis.cache: DEBUG
logging.level.org.springframework.cache.interceptor: TRACE

